<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercises — Complete Intro to Vue 3</title>
</head>
<body style="background-color: black; color: white">
    <div id="app">
        <h1> Hello, {{ showName.toUpperCase()}}</h1>
        <!-- Place the most common scenario first (performance!).-->
        <ul v-if="characters.length === 0">
            No characters fetched.
        </ul>
        <ul v-else>
            <li v-for="character in characters">
                {{ character.name }}<span v-if="character.title"> - {{ character.title }}</span> - {{ character.race }}<span v-if="character.age"> - {{ character.age }} years old</span>
            </li>
        </ul>
        <!-- Span characters' names, not putting comma after the last element.-->
        <span v-for="(character, index) in characters">
            {{ character.name }}{{index === characters.length - 1 ? '.' : ', '}}
        </span>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./src/utils.js"></script>
    <script src="./src/Character.js"></script>

    <script>
        const { createApp } = Vue
        const showName = "World of Warcraft"

        const alleria = new Character("Alleria Windrunner", "Void Elf", null, 'February 20, 473', 3000, 'December 2, 2025', sources=["https://losteventidestudios.com/wow/index.php/Characters/AlleriaWindrunner", "https://losteventidestudios.com/wow/index.php/Characters/SylvanasWindrunner"])
        const sylvanas = new Character("Sylvanas Windrunner", "Darkfallen / Banshee / Undead High Elf", null, null, 2800, sources=["https://characterprofile.fandom.com/wiki/Sylvanas_Windrunner"])
        const arator = new Character("Arator", "Half-Elf / Half-Human", "The Redeemer", null, 40, null)
        const turalyon = new Character("Turalyon", "Human (Lightforged)", "High Exarch", null, 40, null)

        // Configuration object
        const app = createApp({
            data: () => ({
                message: "Hello, it works!",
                listOfNumbers: [1, 2, 3, 4, 5],
                showName: `${showName}, Azeroth time: ${calculateFictionalNow('February 20, 473', 3000, 'December 2, 2025')}` ,
                characters: [
                    {name: alleria.name, title: alleria.title, race: alleria.race, dob: alleria.fictionalDoB, age: alleria.age()},
                    {name: sylvanas.name, title: sylvanas.title, race: sylvanas.race, dob: sylvanas.fictionalDoB, age: sylvanas.age()},
                    {name: arator.name, title: arator.title, race: arator.race, dob: arator.fictionalDoB, age: arator.age()},
                    {name: turalyon.name, title: turalyon.title, race: turalyon.race, dob: turalyon.fictionalDoB, age: turalyon.age()},
                ]
            })

        })

        app.mount('#app')
    </script>
</body>
</html>
