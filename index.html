<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercises — Complete Intro to Vue 3</title>
</head>
<body style="background-color: black; color: white">
    <div id="app">
        <h1> Hello, {{ showName.toUpperCase()}}</h1>
        <!-- Place the most common scenario first (performance!).-->
        <ul v-if="characters.length === 0">
            No characters fetched.
        </ul>
        <ul v-else>
            <li v-for="character in characters">
                {{ character.name }}<span v-if="character.title"> - {{ character.title }}</span> - {{ character.race }}<span v-if="character.age"> - {{ character.age() }} years old</span>
                <button @click="populateFavoriteCharacters($event)" :data-key="character.id">Favorite</button>
            </li>
        </ul>
        <!-- Span favorite characters' names, not putting comma after the last element.-->
        <span v-for="(character, index) in favoriteCharacters">
            {{ character.name }}{{index === characters.length - 1 ? '.' : ', '}}
            <!-- {{ character.name }}{{index === characters.length - 1 ? '.' : (index === 0 ? '': ', ')}} -->
        </span>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./src/utils.js"></script>
    <script src="./src/Character.js"></script>

    <script>
        const { createApp } = Vue
        const showName = "World of Warcraft"

        const alleria = new Character(1, "Alleria Windrunner", "Void Elf", null, 'February 20, 473', 3000, 'December 2, 2025', sources=["https://losteventidestudios.com/wow/index.php/Characters/AlleriaWindrunner", "https://losteventidestudios.com/wow/index.php/Characters/SylvanasWindrunner"])
        const sylvanas = new Character(2, "Sylvanas Windrunner", "Darkfallen / Banshee / Undead High Elf", null, null, 2800, sources=["https://characterprofile.fandom.com/wiki/Sylvanas_Windrunner"])
        const vereesa = new Character(4, "Vereesa Windrunner", "High Elf", "Ranger-General of the Silver Covenant", "June 19, 529", null, sources=["https://losteventidestudios.com/wow/index.php/Characters/vereesaWindrunner"])
        const arator = new Character(4, "Arator", "Half-Elf / Half-Human", "The Redeemer", null, 40, null)
        const turalyon = new Character(5, "Turalyon", "Human (Lightforged)", "High Exarch", null, 40, null)

        // Configuration object
        const app = createApp({
            data: () => ({
                message: "Hello, it works!",
                showName: `${showName}, Azeroth time: ${calculateFictionalNow('February 20, 473', 3000, 'December 2, 2025')}` ,
                characters: [alleria, sylvanas, vereesa, arator, turalyon],
                favoriteCharacters: []
            }),
            methods: {
                populateFavoriteCharacters(event) {
                    let character
                    for (const ch of this.characters) {
                        if (ch.id == event.target.dataset.key) {
                            character = ch
                            break
                        }
                    }
                    if (character) {
                        // NOTE: consider checking for duplicates
                        this.favoriteCharacters.push(character);
                    } else {
                        throw new Error(`Cannot find a character with id ${event.target.dataset.key}`)
                    }
                }
            }

        })

        app.mount('#app')
    </script>
</body>
</html>
