<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercises — Complete Intro to Vue 3</title>
</head>
<body style="background-color: black; color: white">
    <div id="app">
        <h1> Hello, {{ showName.toUpperCase()}}</h1>
        <!-- Place the most common scenario first (performance!).-->
        <ul v-if="characters.length === 0">
            No characters fetched.
        </ul>
        <ul v-else>
            <li v-for="character in characters">
                {{ character.name }}<span v-if="character.title"> - {{ character.title }}</span> - {{ character.race }}<span v-if="character.age"> - {{ character.age }} years old</span>
            </li>
        </ul>
        <!-- Span characters' names, not putting comma after the last element.-->
        <span v-for="(character, index) in characters">
            {{ character.name }}{{index === characters.length - 1 ? '.' : ','}}
        </span>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue
        const showName = "World of Warcraft"

        let calculatedAge = (minimumAgeYearsFromSource, sourcePostDate) => {
            let now = new Date()
            let yearsPassed = (now - new Date(sourcePostDate)) / (1000 * 60 * 60 * 24 * 365.25)
            return Math.ceil(minimumAgeYearsFromSource + yearsPassed)
        };

        let calculateFictionalNow = (fictionalDob, ageAtSourceDate, realWorldSourceDate) => {
            // Fictional date at the real-world source date = DOB + age at that time
            let fictionalRef = new Date(fictionalDob)
            fictionalRef.setFullYear(fictionalRef.getFullYear() + ageAtSourceDate)
            // Add real-world time elapsed since the source date
            let msElapsed = new Date() - new Date(realWorldSourceDate)
            let fictionalNow = new Date(fictionalRef.getTime() + msElapsed)
            return fictionalNow.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
        }

        // const imaginaryDobAlleriaFromSource = new Date('February 20, 473') // source (creation date unknown; non-canon): https://losteventidestudios.com/wow/index.php/Characters/AlleriaWindrunner
        // const minimumAgeAlleriaYearsFromSource = 3000
        // const realWorldDateWhenGivenAgeFromSource = new Date('December 2, 2025') // source edited (for the lack of creation date)
        // let now = new Date()
        // let yearsPassed = (now - realWorldDateWhenGivenAgeFromSource) / (1000 * 60 * 60 * 24 * 365.25) // convert milliseconds to years;
        // let calculatedAgeAlleriaYears = Math.ceil(minimumAgeAlleriaYearsFromSource + yearsPassed);

        // Should be 3001+
        calculatedAgeYearsAlleria = calculatedAge(3000, 'December 2, 2025')

        // Configuration object
        const app = createApp({
            data: () => ({
                message: "Hello, it works!",
                listOfNumbers: [1, 2, 3, 4, 5],
                showName: `${showName}, Azeroth time: ${calculateFictionalNow('February 20, 473', 3000, 'December 2, 2025')}` ,
                characters: [
                    {name: "Alleria Windrunner", title: null, race: "Void Elf", dob: 'February 20, 473', age: calculatedAgeYearsAlleria},
                    {name: "Sylvanas Windrunner", title: null, race: "Darkfallen / Banshee / Undead High Elf", age: null}, // age 2800
                    {name: "Arator", title: "The Redeemer", race: "Half-Elf / Half-Human", age: null}, // age 40
                    {name: "Turalyon", title: "High Exarch", race: "Human (Lightforged)", age: null}, // age 40
                ]
            })

        })

        app.mount('#app')
    </script>
</body>
</html>
